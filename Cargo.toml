[package]
name = "checheviewer"
version = "0.1.1"
edition = "2021"
description = "Fast, keyboard-driven image viewer for macOS, inspired by IrfanView"
repository = "https://github.com/ezeql/checheviewer"
license = "MIT"

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "accesskit",
] }
egui = "0.36"
image = "0.25"
natord = "1"
anyhow = "1"
crossbeam-channel = "0.5"
lru = "0.18"
rfd = "0.17"

# Native decoding: HEIC, RAW and embedded thumbnails, everything Preview.app
# opens. No Homebrew dependencies.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-image-io = "0.3"
objc2-foundation = "0.3"
block2 = "0.6"

[profile.release]
opt-level = 3
lto = "thin"

# Without this, decoding a JPEG in debug mode is unbearably slow: dependencies
# are built optimized even though our own code is not.
[profile.dev.package."*"]
opt-level = 2
